llm:
  backend: ollama
  model: qwen3:8b      # candidato elegido tras el benchmark (docs/fase1_bench.md); alternativa: qwen2.5:7b-instruct-q4_K_M
  think: false         # sin modo "pensar" (solo afecta a modelos con razonamiento, como qwen3)
  host: http://127.0.0.1:11434
  keep_alive: 10m
  options:
    temperature: 0.7
    num_ctx: 4096
  candidates:
    - qwen2.5:7b-instruct-q4_K_M
    - llama3.1:8b-instruct-q4_K_M
    - qwen3:8b
stt:
  backend: faster-whisper
  model: small          # tiny/base/small; small en CPU conserva la calidad y no usa VRAM (docs/fase3.md)
  device: cpu           # la GPU solo tiene ~535 MB libres con LLM + voz cargados
  compute_type: int8
  language: es          # null = detectar idioma
  beam_size: 1          # decodificación voraz: mucho más rápida, casi igual de precisa
  initial_prompt: "Jarvis, Ollama, Qwen, CCNA, GitHub, VRAM, ciberseguridad, Lima"  # vocabulario: baja el WER (docs/fase3.md)
  vad_filter: true      # faster-whisper descarta silencios internos
  cpu_threads: 0        # 0 = automático
  silence_ms: 800       # silencio que cierra una frase al hablar
  threshold: null       # null = se calibra con el ruido ambiente al iniciar
  device_index: null    # null = micrófono predeterminado de Windows (ver python listen.py --list-mics)
tts:
  backend: kokoro
  voice: voicelab/packs/am_voz1.pt   # pack de voz clonada con inno-kokoro (Fase 2)
  lang_code: e                       # español
  device: cuda
  trim_cache: true                   # libera caché de CUDA tras cada trozo (menos VRAM)
  speed: 1.1                         # elegido en voicelab.tune
voice:
  tail_ms: 500          # micro cerrado este tiempo extra tras la última palabra de JARVIS (anti-eco)
  max_turns: 8          # intercambios que recuerda el LLM en el prompt (num_ctx es 4096)
memory:
  enabled: true
  db_path: data/jarvis_memory.db   # SQLite local; *.db ya está en .gitignore (repo público)
  embedder:
    backend: ollama
    model: bge-m3          # multilingüe (ollama pull bge-m3); alternativas: embeddinggemma, nomic-embed-text
    host: http://127.0.0.1:11434
    device: cpu            # num_gpu 0: no gasta VRAM (con LLM + voz quedan ~535 MB libres)
    keep_alive: 10m
  top_facts: 5             # hechos que se inyectan como máximo por turno
  top_episodes: 2          # recuerdos de conversaciones pasadas por turno
  min_fact_score: 0.45     # bge-m3 medido: acierto mín 0.47, error máx 0.48 (se solapan); mejor pecar de permisivo
  min_episode_score: 0.50  # sin medir (turnos largos); ajustar mirando [memoria] con --debug
  dedupe_score: 0.90       # un hecho casi igual a otro lo actualiza en vez de duplicarlo
  forget_score: 0.60       # parecido mínimo para borrar con "olvida ..."
  max_block_chars: 1200    # ~300 tokens del contexto de 4096
  summarize_on_exit: true  # al salir: resumen de la sesión + hechos nuevos (usa el LLM, unos segundos)
  min_turns_to_summarize: 2
